# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Build and Publish
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # setup-uv publishes no floating major tag, so this has to be an exact pin.
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --locked fails the build if uv.lock drifts from pyproject.toml, which is what stops
      # a dependency bump merging with a stale lock. Syncing the project itself is also what
      # proves the runtime deps in pyproject are complete.
      - name: Install project and test dependencies
        run: uv sync --locked

      - name: Run offline tests
        run: uv run pytest tests/test_client.py

  build:
    name: Build
    needs:
      - test
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # v6 changed the default patterns to Conventional Commits. They are pinned here to keep
      # the (MAJOR)/(MINOR) markers this history already uses, so the upgrade changes no version.
      - id: semantic_version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: 'v'
          major_pattern: '(MAJOR)'
          minor_pattern: '(MINOR)'

      - name: Set version in pyproject.toml
        run: |
          version="${{ steps.semantic_version.outputs.version }}"
          sed -i "s/^version = .*/version = \"$version\"/" pyproject.toml

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-test:
    name: Publish to Test PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: testpypi
      url: https://test.pypi.org/p/trading212-api-py

    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/

  release-text:
    name: Create Release Text
    permissions:
      contents: none
    needs:
      - build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Create release.txt
        run: |
          version="${{ github.ref_name }}"
          printf "Thank you for using trading212-api-py!\n\n" > release.txt
          printf "Documentation: https://github.com/clincha/trading212-api-py/tree/${version}/documentation\n" >> release.txt
          printf "Date: $(date -u +"%Y-%m-%d %H:%M:%S")\n" >> release.txt
          printf "PyPi: https://pypi.org/project/trading212-api-py/${version:1}\n" >> release.txt
          cat release.txt

      - name: Upload release.txt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-text
          path: release.txt
          if-no-files-found: 'error'

  release:
    name: Create Release
    permissions:
      contents: write
    needs:
      - build
      - publish-test
      - release-text
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: release

    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release.txt
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-text
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          body_path: release/release.txt
          files: dist/*

  publish:
    name: Publish to PyPI
    permissions:
      id-token: write
    needs:
      - build
      - publish-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/trading212-api-py

    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
