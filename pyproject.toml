[project]
name = "trading212-api-py"
version = "0.0.0" # The real version is set by the GitHub Actions workflow
authors = [
  { name="Angus Clinch", email="angus.clinch@gmail.com" },
]
description = "A Python client for the Trading212 API."
readme = "README.md"
requires-python = ">=3.10"
# Floor is 2.33 because that is the first release carrying the CVE fix, and it is also
# where requests dropped 3.9 — which is why 3.9 support had to go with it.
dependencies = [
    "requests>=2.33,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/clincha/trading212-api-py"
Issues = "https://github.com/clincha/trading212-api-py/issues"

[build-system]
requires = ["setuptools ~= 80.9.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]
